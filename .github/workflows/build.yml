name: Build APK + Windows Setup

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --project-name prezzo_artigiano --org com.artigiano --no-pub .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prezzo-artigiano-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform
        shell: pwsh
        run: flutter create --platforms=windows --project-name prezzo_artigiano --org com.artigiano --no-pub .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Verify Windows EXE
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\prezzo_artigiano.exe"
          if (!(Test-Path $exe)) {
            Write-Error "EXE Windows non trovato: $exe"
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            Write-Error "ISCC.exe non trovato"
            exit 1
          }
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify Setup.exe
        shell: pwsh
        run: |
          $setup = "installer_output\Prezzo-Artigiano-Setup.exe"
          if (!(Test-Path $setup)) {
            Write-Error "Setup.exe non trovato"
            exit 1
          }
          Get-Item $setup | Select-Object FullName,Length

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: prezzo-artigiano-windows-setup
          path: installer_output/Prezzo-Artigiano-Setup.exe

name: Build APK + Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Android and Windows in parallel
    strategy:
      fail-fast: false
      matrix:
        target: [android, windows]
    runs-on: ${{ matrix.target == 'android' && 'ubuntu-latest' || 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform files
        shell: bash
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android,windows --project-name prezzo_artigiano --org com.artigiano .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        if: matrix.target == 'android'
        run: flutter build apk --release

      - name: Upload APK
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: prezzo-artigiano-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Upload Windows
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: prezzo-artigiano-windows
          path: build/windows/x64/runner/Release/

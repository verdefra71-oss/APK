name: Build APK + Windows Setup FIX8

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name prezzo_artigiano --org com.artigiano --no-pub .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: prezzo-artigiano-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name prezzo_artigiano --org com.artigiano --no-pub .

      - name: Doctor
        run: flutter doctor -v

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows
        run: flutter build windows --release -v

      - name: Verify executable and runtime
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $exe = Join-Path $release "prezzo_artigiano.exe"
          if (!(Test-Path $exe)) { throw "EXE non trovato: $exe" }
          Write-Host "Release contents:"
          Get-ChildItem $release -Recurse | Select-Object FullName,Length
          Write-Host "EXE:"
          Get-Item $exe | Select-Object FullName,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "ISCC.exe non trovato" }
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Setup
        uses: actions/upload-artifact@v4
        with:
          name: prezzo-artigiano-windows-setup-fix8
          path: installer_output/Prezzo-Artigiano-Setup-FIX8.exe

      - name: Upload raw Windows build for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: prezzo-artigiano-windows-raw-fix8
          path: build/windows/x64/runner/Release/**
